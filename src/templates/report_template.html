<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ report_type | title }} Report</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; line-height: 1.6; padding: 20px; max-width: 800px; margin: 0 auto; color: #333; }
        h1 { color: #2c3e50; border-bottom: 2px solid #3498db; padding-bottom: 10px; }
        .content-box { background: #f9f9f9; padding: 20px; border-radius: 8px; border: 1px solid #ddd; }
        .footer { margin-top: 40px; font-size: 0.8em; color: #7f8c8d; text-align: center; }
    </style>
</head>
<body>
    <h1>{{ report_type | title }} Report</h1>
    
    <div class="content-box">
        <p>{{ content }}</p>
    </div>
    
    <div class="footer">
        Generated by NemoClaw Price Tracker. This secure link will expire in 24 hours.
    </div>
</body>
</html>
